# ─────────────────────────────────────────────
#  configs/train.yaml
#  Configuration for data preprocessing + training
# ─────────────────────────────────────────────

data:
  test_size: 0.2              # 20 % held-out test set
  random_seed: 42
  train_csv: "sample_data/train.csv"
  test_csv:  "sample_data/test.csv"
  label_map: "sample_data/label_map.yaml"

model:
  # Any causal-LM supported by Unsloth (4-bit quantised loads fine on a single GPU)
  base_model: "unsloth/llama-3-8b-bnb-4bit"
  max_seq_length: 128
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "outputs/banking-intent"
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2       # effective batch = 16
  num_train_epochs: 5
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  optimizer: "adamw_8bit"              # Unsloth's memory-efficient AdamW
  fp16: false
  bf16: true                           # use bf16 if your GPU supports it; else set false + fp16 true
  logging_steps: 10
  eval_strategy: "epoch"
  save_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "eval_accuracy"
  seed: 42
